.set .ty.w{color:var(--warn)}.set .ty.d{color:var(--alt)}
.set .ok{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.set .ok svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.set.dn .ok{background:var(--good);border-color:var(--good);color:var(--accent-ink)}.set.dn input{color:var(--muted)}
.mini{display:flex;gap:6px;flex-wrap:wrap}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit;font:inherit}
.item:last-child{border-bottom:0}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.medal.got b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.medal.got{color:var(--ink)}
.medal span{line-height:1.2}
svg text{font-family:var(--body)}.ax{fill:var(--muted);font-size:11px}
.toast{border:1px solid var(--line);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--raised);color:var(--ink);padding:10px 16px;border-radius:99px;font-size:14px;z-index:60;max-width:90%}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.note{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:12px;font-size:15px}
.note.rest{background:var(--good-soft);color:var(--ink)}
.mini-in{width:56px;min-height:36px;padding:4px 6px;text-align:center;font-size:16px}
.pkbar{position:sticky;bottom:-20px;background:var(--bg);padding:10px 0 4px;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.greet{position:fixed;left:16px;right:16px;top:calc(18% + env(safe-area-inset-top,0px));max-width:420px;margin:0 auto;z-index:81;background:var(--raised);border:1.5px solid var(--accent);border-radius:18px;padding:20px;text-align:center;box-shadow:0 12px 40px #000a}

.set.hd{font:600 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
button.dot{background:transparent;cursor:pointer}
.pf{display:flex;gap:8px;align-items:flex-end}.pf label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;align-items:center}
.mv{display:flex;flex-direction:column;gap:4px}

const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const fmt=(n,d=1)=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:d}).format(n);

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const weekStart=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};

function bestE1(exId){let b=0;if(tm(exId))return 0;for(const w of S.workouts)for(const e of w.entries||[])if(e.exId===exId)for(const s of working(e))b=Math.max(b,e1(num(s.w),num(s.r)));return b}
function lastSets(exId){const ws=S.workouts.filter(w=>w.type==='gym'&&(w.entries||[]).some(e=>e.exId===exId)).sort((a,b)=>b.ts-a.ts);if(!ws.length)return[];return working(ws[0].entries.find(e=>e.exId===exId))}

function weekStreak(){const g=S.settings.weekGoal;let d=weekStart(new Date()),n=0;if(weekCount(iso(d))>=g)n++;d=addDays(d,-7);while(weekCount(iso(d))>=g){n++;d=addDays(d,-7)}return n}
function bestStreak(){if(!S.workouts.length)return 0;const g=S.settings.weekGoal;let d=weekStart(parse(S.workouts.reduce((a,w)=>w.date<a?w.date:a,'9999')));const end=weekStart(new Date());let run=0,best=0;while(d<=end){if(weekCount(iso(d))>=g){run++;best=Math.max(best,run)}else run=0;d=addDays(d,7)}return best}

const LEVELS={anf:'Anfänger',mid:'Fortgeschritten',adv:'Erfahren'};
function genPlan(o){
  const g=GOALS[o.goal],knee=!!o.knee;let sets=g.s,reps=g.r;
  if(o.level==='anf')sets=Math.max(2,sets-1);if(o.level==='adv'&&o.goal!=='fitness')sets+=1;
  if(o.goal==='sims'&&o.level==='anf')reps='6-10';
  const n=Math.max(3,Math.min(6,Math.round(o.min/11)));
  const keys=(o.goal==='sims'?SIMS:SPLIT)[o.days];let kb=0;
  const days=keys.map(k=>{
    if(k==='sprint')return{name:'Sprint-Intervalle',kind:'sprint',ex:[],sp:{n:{anf:4,mid:6,adv:8}[o.level]||6,s:20,r:180},desc:'Wenige maximale Sprints von 20 Sekunden mit langer Pause (3 Minuten), damit jeder Sprint wirklich schnell ist.'};
    if(k==='locker')return{name:'Locker & Mobilität',kind:'locker',ex:[],desc:'30 Minuten Spazieren, Mobility oder Yoga. Kein Leistungsdruck, fördert die Erholung.'};
    const pick=sl=>Array.isArray(sl)?(knee?sl[1]:sl[0]):sl;
    const ex=TPL[k][1].slice(0,n).map(pick).map(id=>({id,sets,reps:tm(id)?'40':reps}));
    if(o.focus&&FOCUS[o.focus]&&FOCUS[o.focus][1].length){
      const g=FOCUS[o.focus][1],pool=exAll().filter(e=>g.includes(e.m)&&!ex.some(x=>x.id===e.id)&&(!knee||!KNEE_HEAVY.includes(e.id)));
      const di=keys.indexOf(k);for(let q=0;q<Math.min(2,pool.length);q++){const e=pool[(di*2+q)%pool.length];ex.splice(1+q,0,{id:e.id,sets,reps:tm(e.id)?'40':reps})}
    }
    if(knee&&LOWER.includes(k)){const b=KNEE_BLOCK[kb++%KNEE_BLOCK.length];ex.unshift({id:b[0],sets:b[1],reps:b[2]})}
    return{name:TPL[k][0],kind:'kraft',ex};
  });
  return{id:uid(),name:(o.goal==='sims'?'Sims-Woche':g.n)+' · '+o.days+'× pro Woche'+(o.focus?' · Fokus '+FOCUS[o.focus][0]:''),goal:o.goal,level:o.level,min:o.min,knee,days};
}
function nextPlanDay(){const p=S.plans.find(p=>p.id===S.activePlan);if(!p||!p.days.length)return null;const last=S.workouts.filter(w=>w.planId===p.id).sort((a,b)=>b.ts-a.ts)[0];const idx=last&&last.dayIdx!=null?(last.dayIdx+1)%p.days.length:0;return{plan:p,idx,day:p.days[idx]}}

function mkEntry(exId,n,reps,pw){const last=lastSets(exId);const sets=[];const pr=String(reps||'').split('-')[0].trim();for(let i=0;i<(n||3);i++){const l=last[i]||last[last.length-1];sets.push({w:(pw!==''&&pw!=null)?String(pw):(l?l.w:''),r:/^\d+$/.test(pr)?pr:(l?l.r:''),done:false,t:'n'})}return{exId,notes:'',link:false,target:reps||'',sets}}
function startWorkout(name,list,planId,dayIdx){
  if(S.active){UI.tab='train';render();return}
  S.active={id:uid(),start:Date.now(),name:name||'Training',notes:'',planId:planId||null,dayIdx:dayIdx==null?null:dayIdx,entries:list.map(x=>mkEntry(x.id,x.sets,x.reps,x.w))};
  UI.tab='train';save();render();wake();
}
function finalize(a,ts,opt){
  opt=opt||{};
  const entries=a.entries.map(e=>Object.assign({},e,{sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  const prs=[];
  for(const e of entries){const prev=bestE1(e.exId);const cur=tm(e.exId)?0:Math.max(0,...working(e).map(s=>e1(num(s.w),num(s.r))));if(prev>0&&cur>prev+0.01)prs.push(e.exId)}
  const ws=entries.flatMap(working);
  const sets=ws.length,vol=Math.round(entries.reduce((n,e)=>n+(tm(e.exId)?0:working(e).reduce((m,s)=>m+num(s.w)*num(s.r),0)),0));
  const dur=opt.dur||Math.max(1,Math.round((ts-a.start)/60000));
  const w={id:uid(),type:'gym',name:a.name||'Training',date:iso(new Date(ts)),ts,dur,entries,notes:a.notes||'',prs,vol,sets,xp:40+3*sets+20*prs.length,planId:a.planId,dayIdx:a.dayIdx};
  if(opt.demo)w.demo=true;S.workouts.push(w);return w;
}

/* ===== Erinnerungen (in der App) ===== */
function reminder(){
  const now=new Date(),ts=todayISO(),wd=(now.getDay()+6)%7,g=S.settings.weekGoal;
  if(S.workouts.some(w=>w.date===ts&&qual(w)))return{k:'ok',t:'Heute schon trainiert. Erholung gehört dazu.'};
  let run=0;for(let i=1;i<=3;i++){if(S.workouts.some(w=>w.date===iso(addDays(now,-i))&&w.type==='gym'))run++;else break}
  if(run>=3)return{k:'rest',t:'Drei Krafttage in Folge. Heute lieber locker bewegen und erholen.'};
  const wc=weekCount(weekKey(now)),left=6-wd;
  if(wc<g&&g-wc>left)return{k:'must',t:'Für dein Wochenziel brauchst du heute ein Training: '+(g-wc)+' offen, danach nur noch '+left+' Tage.'};
  const nd=nextPlanDay();
  if(S.settings.trainDays.includes(wd)&&wc<g)return{k:'plan',t:'Heute ist Trainingstag'+(nd?': '+nd.day.name+'.':'.')};
  const last=S.workouts.filter(qual).sort((a,b)=>b.ts-a.ts)[0];
  if(last){const n=Math.round((parse(ts)-parse(last.date))/864e5);if(n>=5)return{k:'back',t:'Seit '+n+' Tagen kein Training. Auch 20 Minuten zählen.'}}
  return null;
}
function maybeNotify(){
  try{
    if(!S.settings.notif||!('Notification' in window)||Notification.permission!=='granted'||S.notified===todayISO())return;
    const r=reminder();if(!r||r.k==='ok'||r.k==='rest')return;
    const n=new Date();const [h,m]=S.settings.remindTime.split(':').map(Number);
    if(n.getHours()*60+n.getMinutes()<h*60+m)return;
    new Notification('Beastmode',{body:r.t});S.notified=todayISO();save();
  }catch(e){}
}

  const base={slowsq:10,kbank:14,lat:35,rdl:16,sldl:10,schr:12,tric:20,kick:5,ham:8,hipt:24,bulg:8,crunch:20,pallof:10,cabkick:5,balllc:0,pbbridge:0,sglute:0,copen:0,plank:0,wallsit:0,isoextkb:0,wallsitband:0,tke:0};
  const now=Date.now();let k=0;
  for(let back=19;back>=1;back-=1){
    if(back%7===0||back%7===3||back%7===5){
      const di=k%3,day=plan.days[di],prog=Math.floor(k/3)*1;
      const a={start:0,name:day.name,planId:plan.id,dayIdx:di,entries:day.ex.map(x=>({exId:x.id,notes:'',link:false,target:x.reps,sets:[0,1,2].map(j=>({w:base[x.id]?String(base[x.id]+prog):'',r:tm(x.id)?String(35+j*5):String(10-j+(k%2)),done:true,t:'n'}))}))};
      finalize(a,now-back*864e5,{demo:true,dur:50+(k%4)*5});k++;
    }
  }
  S.workouts.sort((a,b)=>a.ts-b.ts);
  S.weights=[0,1,2,3,4].map(i=>({d:iso(addDays(new Date(),-28+i*7)),kg:+(68.4-i*0.3).toFixed(1),demo:true}));
}

function confetti(big){

  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.hidden=false;
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const cols=['#2EF2A6','#10A3A3','#FF7468','#FFC857','#F4F8FB'],n=big?220:110;
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*(big?16:12),vy:-Math.random()*(big?18:14)-4,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-.5)*.4}));

}
function celebrate(title,msg,big,btn){
  const old=document.querySelector('.greet');if(old)old.remove();
  const d=document.createElement('div');d.className='greet';d.setAttribute('role','status');
  d.innerHTML='<h2>'+esc(title)+'</h2><p>'+esc(msg)+'</p><button class="btn primary block">'+esc(btn||'Weiter')+'</button>';
  document.body.appendChild(d);const kill=()=>d.remove();d.querySelector('button').onclick=kill;setTimeout(kill,9000);
  confetti(big);
}
function greetIfNewDay(){
  const t=todayISO();if(S.lastOpen===t)return;
  S.lastOpen=t;save();
  const g=pickDay(GREETS);celebrate(g[0],g[1],false,'Los geht\'s');
}
/* Merkt sich erledigte Plantage; liefert true, wenn alle Tage einer Runde geschafft sind */
function planProgress(planId,dayIdx){
  const p=S.plans.find(p=>p.id===planId);if(!p||dayIdx==null)return null;
  p.cycle=p.cycle||[];if(!p.cycle.includes(dayIdx))p.cycle.push(dayIdx);
  if(p.days.every((_,i)=>p.cycle.includes(i))){p.cycle=[];p.rounds=(p.rounds||0)+1;save();return 'done'}
  save();return 'day';
}
function afterPlanWorkout(planId,dayIdx){
  const r=planProgress(planId,dayIdx);if(!r)return;
  if(r==='done')celebrate('Plan abgeschlossen!',pickRnd(PLANDONE),true,'Danke');
  else celebrate('Trainingstag geschafft!',pickRnd(PRAISE),false,'Weiter');
}

/* ===== Diagramme ===== */
function lineSvg(pts,unit){
  if(pts.length<2)return '<p class="sub">Für den Verlauf werden mindestens zwei Einträge gebraucht.</p>';
  const W=320,H=160,L=38,R=12,T=14,B=24;
  const ys=pts.map(p=>p.y);let lo=Math.floor(Math.min(...ys)*.95/2.5)*2.5,hi=Math.ceil(Math.max(...ys)*1.03/2.5)*2.5;if(hi<=lo)hi=lo+5;
  const t0=pts[0].t,t1=pts[pts.length-1].t||1;
  const X=t=>L+(t1===t0?0:(t-t0)/(t1-t0))*(W-L-R),Y=y=>T+(1-(y-lo)/(hi-lo))*(H-T-B);
  const mid=(lo+hi)/2;
  const grid=[lo,mid,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text class="ax" x="${L-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v,1)}</text>`).join('');
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const lp=pts[pts.length-1];
  const dt=t=>new Date(t).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Verlauf in ${unit}">${grid}
  <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map(p=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="var(--accent)"/>`).join('')}
  <circle cx="${X(lp.t).toFixed(1)}" cy="${Y(lp.y).toFixed(1)}" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
  <text class="ax" x="${L}" y="${H-6}">${dt(t0)}</text><text class="ax" x="${W-R}" y="${H-6}" text-anchor="end">${dt(t1)}</text></svg>`;
}
function barSvg(rows,goalLine){
  const W=320,H=140,L=8,R=8,T=18,B=22,max=Math.max(1,...rows.map(r=>r.v));
  const bw=(W-L-R)/rows.length;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Wochenvolumen in Tonnen"><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
  ${rows.map((r,i)=>{const h=(r.v/max)*(H-T-B),x=L+i*bw+bw*.18,w=bw*.64;return `<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,r.v?2:0).toFixed(1)}" rx="3" fill="${r.cur?'var(--accent)':'var(--muted)'}" opacity="${r.cur?1:.55}"/>
  <text class="ax" x="${(x+w/2).toFixed(1)}" y="${(H-B-h-4).toFixed(1)}" text-anchor="middle">${r.v?fmt(r.v,1):''}</text><text class="ax" x="${(x+w/2).toFixed(1)}" y="${H-7}" text-anchor="middle">${r.l}</text>`}).join('')}</svg>`;
}

function suggest(e){
  const last=lastSets(e.exId);if(!last.length)return'';
  const up=parseInt(String(e.target).split('-').pop())||(tm(e.exId)?40:10);
  const all=last.every(s=>num(s.r)>=up&&(tm(e.exId)||num(s.w)>0));
  const txt=last.map(s=>setTxt(e.exId,s)).join(', ');
  return 'Zuletzt: '+txt+(all?(tm(e.exId)?' · Vorschlag: 5 Sekunden länger':' · Vorschlag: '+fmt(num(last[0].w)+2.5)+' kg'):'');
}

  return `<div class="card stack"><div class="row between wrap"><div class="grow"><h3>${esc(p.name)}</h3><p class="sub">${p.manual?'Manuell erstellt':(GOALS[p.goal]?GOALS[p.goal].n:'')+' · '+(LEVELS[p.level]||'')+' · ca. '+(p.min||60)+' Min'}${p.knee?' · Knie schonen':''}${p.demo?' · Beispiel':''}</p></div>${act?'<span class="tag good">Aktiv</span>':'<button class="btn sm" data-act="activate" data-p="'+p.id+'">Aktivieren</button>'}</div>
  ${p.days.map((d,di)=>`<div><div class="row between">${p.manual?`<input class="mini-in" style="flex:1;text-align:left;font-weight:600" data-in="dayname" data-p="${p.id}" data-d="${di}" value="${esc(d.name)}" aria-label="Name des Trainingstags">`:`<b>${esc(d.name)}</b>`}<span class="mini">${d.kind==='sprint'||d.kind==='locker'?'':`<button class="btn sm" data-act="padd" data-p="${p.id}" data-d="${di}">+ Übung</button>`}<button class="btn sm primary" data-act="startplan" data-p="${p.id}" data-d="${di}">Start</button></span></div>
  ${d.desc?`<p class="sub" style="padding:6px 0">${esc(d.desc)}${d.sp?' ('+d.sp.n+' × '+d.sp.s+' s, Pause '+d.sp.r/60+' Min)':''}</p>`:''}
  ${(d.ex||[]).map((x,k)=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row between"><b>${esc(exById(x.id).name)}</b><span class="mini" style="flex-wrap:nowrap"><button class="btn sm" data-act="pmv" data-p="${p.id}" data-d="${di}" data-k="${k}" data-m="-1" ${k?'':'disabled'} aria-label="Nach oben">↑</button><button class="btn sm" data-act="pmv" data-p="${p.id}" data-d="${di}" data-k="${k}" data-m="1" ${k<d.ex.length-1?'':'disabled'} aria-label="Nach unten">↓</button><button class="btn sm ghost" data-act="pdel" data-p="${p.id}" data-d="${di}" data-k="${k}" aria-label="Übung entfernen">×</button></span></div>
  <div class="pf" style="margin-top:6px"><label>Sätze<input class="mini-in" inputmode="numeric" data-in="pex" data-p="${p.id}" data-d="${di}" data-x="${k}" data-f="sets" value="${x.sets}"></label><label>${tm(x.id)?'Zusatz kg':'kg'}<input class="mini-in" inputmode="decimal" data-in="pex" data-p="${p.id}" data-d="${di}" data-x="${k}" data-f="w" value="${esc(x.w==null?'':x.w)}" placeholder="–"></label><label>${tm(x.id)?'Sek.':'Wdh.'}<input class="mini-in" data-in="pex" data-p="${p.id}" data-d="${di}" data-x="${k}" data-f="reps" value="${esc(x.reps)}"></label></div></div>`).join('')}</div>`).join('')}
  <button class="btn sm danger" data-act="delplan" data-p="${p.id}">${UI.cf==='plan'+p.id?'Wirklich löschen?':'Plan löschen'}</button></div>`;
}
function viewPlans(){
  return `<div class="head"><h1>Pläne</h1><button class="btn primary sm" data-act="sheet" data-t="gen">Neuer Plan</button></div>
  <div class="stack"><div class="card stack"><p class="lbl">Sims-Woche (Richtwerte)</p><p class="sub">2 bis 3 schwere Krafttage (3 bis 8 Wiederholungen, nahe ans Limit mit sauberer Technik), 1 bis 2 kurze Sprint-Einheiten mit langen Pausen, etwas Impact oder Schnellkraft, dazwischen lockere Bewegung und genug Ruhe. Das sind Prinzipien aus Dr. Stacy Sims' Buch „Next Level“ und kein ärztlicher Rat.</p></div>${S.plans.length?[...S.plans].sort((a,b)=>(b.id===S.activePlan)-(a.id===S.activePlan)).map(planCard).join(''):'<div class="card"><p class="sub">Noch kein Plan. Der Generator baut dir einen Plan nach Ziel, Level, Trainingstagen und Zeit.</p></div>'}</div>`;
}

/* ===== Übungen ===== */
function exListHtml(mode){
  const q=UI.q.trim().toLowerCase();
  const l=exAll().filter(e=>(!UI.mus.length||UI.mus.some(m=>e.m===m||e.m2.includes(m)))&&(!q||(e.name+' '+e.m+' '+e.eq).toLowerCase().includes(q)));
  if(!l.length)return '<p class="sub" style="padding:12px 0">Nichts gefunden. Lege eine eigene Übung an.</p>';
  return l.map(e=>`<button class="item" data-act="${mode==='pick'?'pickex':'exinfo'}" data-id="${e.id}"><span><b>${esc(e.name)}</b>${e.custom?' <span class="tag">Eigene</span>':''}<br><span class="sub">${esc(e.m)}${e.m2.length?' · '+esc(e.m2.join(', ')):''} · ${esc(e.eq)}${e.u==='s'?' · Zeit':''}</span></span><span class="sub">${mode==='pick'?((UI.sheet&&UI.sheet.sel&&UI.sheet.sel.includes(e.id))?'<b style="color:var(--accent)">✓</b>':'+'):'›'}</span></button>`).join('');
}
const muChips=()=>`<div class="chips"><button class="chip ${UI.mus.length?'':'on'}" data-act="mu" data-m="">Alle</button>${MUSCLES.filter(m=>exAll().some(e=>e.m===m||e.m2.includes(m))).map(m=>`<button class="chip ${UI.mus.includes(m)?'on':''}" data-act="mu" data-m="${m}">${m}</button>`).join('')}</div>`;
function viewEx(){
  return `<div class="head"><h1>Übungen</h1><button class="btn primary sm" data-act="sheet" data-t="newex">Eigene Übung</button></div>
  <div class="stack"><input id="q" data-in="q" type="search" placeholder="Übung suchen" value="${esc(UI.q)}" aria-label="Übung suchen">${muChips()}<div class="card" id="exlist" data-mode="ex">${exListHtml('ex')}</div></div>`;
}

/* ===== Fortschritt ===== */
function viewProg(){
  const gym=S.workouts.filter(w=>w.type==='gym').sort((a,b)=>a.ts-b.ts);
  const ids=[...new Set(gym.flatMap(w=>w.entries.map(e=>e.exId)))];
  if(!UI.progEx||!ids.includes(UI.progEx))UI.progEx=ids[0]||'';
  let chart='<p class="sub">Sobald du Sätze geloggt hast, siehst du hier deinen Verlauf.</p>',pr='';
  if(UI.progEx){
    const pts=[];let best=null;
    gym.forEach(w=>{const e=w.entries.find(e=>e.exId===UI.progEx);if(!e)return;const ws=working(e);const T=tm(UI.progEx);const m=T?Math.max(0,...ws.map(s=>num(s.r))):Math.max(0,...ws.map(s=>e1(num(s.w),num(s.r))));if(m>0)pts.push({t:w.ts,y:+m.toFixed(1)});ws.forEach(s=>{if(T?(!best||num(s.r)>best.r):(!best||num(s.w)>best.w||(num(s.w)===best.w&&num(s.r)>best.r)))best={w:num(s.w),r:num(s.r)}})});
    chart=lineSvg(pts,'kg');
    pr=best?(tm(UI.progEx)?`<div><p class="lbl">Längster Hold</p><span class="num" style="font-size:26px">${best.r} s</span></div>`:`<div class="row" style="gap:20px"><div><p class="lbl">Bester Satz</p><span class="num" style="font-size:26px">${fmt(best.w)} kg × ${best.r}</span></div><div><p class="lbl">Geschätztes 1RM</p><span class="num" style="font-size:26px">${fmt(bestE1(UI.progEx))} kg</span></div></div>`):'';
  }
  const wk0=weekStart(new Date());const rows=[];
  for(let i=7;i>=0;i--){const k=iso(addDays(wk0,-7*i));rows.push({l:i===0?'jetzt':dfmt(k,{day:'numeric',month:'numeric'}),v:S.workouts.filter(w=>weekKey(parse(w.date))===k).reduce((a,w)=>a+(w.vol||0),0)/1000,cur:i===0})}
  const cut=Date.now()-7*864e5,ms={};
  gym.filter(w=>w.ts>=cut).forEach(w=>w.entries.forEach(e=>{const m=exById(e.exId).m;if(m)ms[m]=(ms[m]||0)+working(e).length}));
  const msl=Object.entries(ms).sort((a,b)=>b[1]-a[1]),mx=msl.length?msl[0][1]:1;
  const got=earned();
  return `<div class="head"><h1>Fortschritt</h1></div><div class="stack">
  <div class="card stack"><p class="lbl">Übung</p>${ids.length?`<select data-in="progex" aria-label="Übung wählen">${ids.map(id=>`<option value="${id}" ${id===UI.progEx?'selected':''}>${esc(exById(id).name)}</option>`).join('')}</select>${pr}<p class="lbl">${tm(UI.progEx)?'Längster Hold pro Training (Sekunden)':'Geschätztes 1RM pro Training (kg)'}</p>${chart}`:chart}</div>
  <div class="card stack"><p class="lbl">Volumen pro Woche (Tonnen)</p>${barSvg(rows)}</div>
  <div class="card stack"><p class="lbl">Sätze pro Muskelgruppe, letzte 7 Tage</p>${msl.length?msl.map(([m,n])=>`<div class="row"><span style="width:96px">${m}</span><div class="bar grow"><i style="width:${n/mx*100}%"></i></div><span class="num" style="width:28px;text-align:right">${n}</span></div>`).join(''):'<p class="sub">Keine Kraftsätze in den letzten 7 Tagen.</p>'}</div>
  <div class="card stack"><div class="row between"><p class="lbl">Abzeichen</p><span class="sub">${got.length} von ${BADGES.length}</span></div>
    <div class="medals">${BADGES.map(b=>`<div class="medal ${got.includes(b.id)?'got':''}"><b>${b.l}</b><span><strong>${b.n}</strong><br>${b.d}</span></div>`).join('')}</div></div></div>`;
}


/* ===== Kurse ===== */
const COURSES={shine:['SHiNE Dance',45,6],uplift:['UPLIFT',45,6],spin:['Spinning',45,7],hiit:['HIIT Spinning',45,8],zumba:['Zumba',60,6],eigen:['Eigener Kurs',45,6]};
function weekCourses(){const wk=weekKey(new Date());return S.courses.filter(c=>!c.week||c.week===wk).sort((a,b)=>a.wd-b.wd||(a.time||'').localeCompare(b.time||''))}
const courseDate=c=>iso(addDays(weekStart(new Date()),c.wd));
function courseList(){
  const l=weekCourses();if(!l.length)return'';
  return `<div class="stack" style="gap:0"><p class="lbl" style="margin:4px 0">Kurse diese Woche</p>${l.map(c=>{const ds=courseDate(c),hit=S.workouts.some(w=>w.courseId===c.id&&w.date===ds);
    return `<div class="row between" style="padding:8px 0;border-top:1px solid var(--line)"><span class="grow"><b>${esc(c.name)}</b><br><span class="sub">${DAYS[c.wd]}${c.time?' · '+esc(c.time):''} · ${c.dur} Min${c.week?' · nur diese Woche':' · jede Woche'}</span></span>
    <span class="mini"><button class="btn sm ${hit?'good':''}" data-act="coursehit" data-id="${c.id}">${hit?'Besucht ✓':'Besucht'}</button><button class="btn sm ghost" data-act="coursedel" data-id="${c.id}" aria-label="Kurs entfernen">${UI.cf==='c'+c.id?'Wirklich?':'×'}</button></span></div>`}).join('')}</div>`;
}
/* ===== Sheets ===== */
const sh=(title,body)=>`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><div class="row between" style="margin-bottom:12px"><h2>${esc(title)}</h2><button class="btn sm ghost" data-act="close">Schließen</button></div><div class="stack">${body}</div></div>`;
const opts=(arr,sel)=>arr.map(([v,l])=>`<option value="${v}" ${String(v)===String(sel)?'selected':''}>${l}</option>`).join('');
function renderSheet(){
  const s=UI.sheet,el=$('#sheet');if(!s){el.innerHTML='';return}
  let h='';
  if(s.t==='gen'){const man=s.mode==='man',fo=opts(Object.entries(FOCUS).filter(([k,v])=>!k||exAll().some(e=>v[1].includes(e.m))).map(([k,v])=>[k,v[0]]),'');
    h=sh('Neuer Plan',`<div class="chips"><button class="chip ${man?'':'on'}" data-act="gmode" data-m="auto">Vorschlag</button><button class="chip ${man?'on':''}" data-act="gmode" data-m="man">Manuell</button></div>`+(man?
    `<p class="sub">Du wählst die Übungen selbst aus der Übersicht und kannst bei Bedarf eigene Übungen anlegen.</p>
    <label class="f">Name des Plans<input id="g_name" value="${esc(s.name||'Mein Plan')}"></label>
    <label class="f">Trainingstage<select id="g_days">${opts([1,2,3,4,5,6].map(n=>[n,n+(n===1?' Tag':' Tage')]),s.days||3)}</select></label>
    <div><p class="sub" style="margin-bottom:6px">Muskelgruppen (mehrere möglich, filtert die Übungsübersicht)</p><div class="chips">${MUSCLES.filter(m=>exAll().some(e=>e.m===m||e.m2.includes(m))).map(m=>`<button class="chip ${(s.mus||[]).includes(m)?'on':''}" data-act="gmu" data-m="${m}">${m}</button>`).join('')}</div></div>
    <button class="btn primary block" data-act="dogen">Weiter zur Übungsauswahl</button>`:
    `<label class="f">Muskelgruppe<select id="g_focus">${fo}</select></label>
    <label class="f">Ziel<select id="g_goal">${opts(Object.entries(GOALS).map(([k,v])=>[k,v.n]),'sims')}</select></label>
    <label class="f">Level<select id="g_level">${opts(Object.entries(LEVELS),'mid')}</select></label>
    <label class="f">Trainingstage pro Woche<select id="g_days">${opts([[2,'2 Tage'],[3,'3 Tage'],[4,'4 Tage'],[5,'5 Tage']],3)}</select></label>
    <label class="f">Zeit pro Training<select id="g_min">${opts([[30,'30 Minuten'],[45,'45 Minuten'],[60,'60 Minuten'],[75,'75 Minuten'],[90,'90 Minuten']],60)}</select></label>
    <label class="f">Knie<select id="g_knee">${opts([[1,'Patellarsehne schonen (empfohlen)'],[0,'Keine Rücksicht nötig']],S.settings.knee?1:0)}</select></label>
    <p class="sub">Der Plan nutzt Kurzhanteln, Kabelzug, Bänder, Bälle und Eigengewicht. Mit einer Muskelgruppe kommen pro Tag zwei passende Übungen dazu. „Wechseljahre (Sims)“ plant schwere Kraft, Sprint-Intervalle und lockere Tage.</p>
    <button class="btn primary block" data-act="dogen">Plan erstellen</button>`))}
  else if(s.t==='manual')h=sh(s.title||'Sport loggen',`<label class="f">Sportart oder Kurs<select id="m_sport">${opts(Object.values(COURSES).filter((v,i)=>i<5).map(v=>[v[0],v[0]]).concat(SPORTS.map(x=>[x,x])),s.sport||(s.back?'UPLIFT':'Spazieren'))}</select></label>
    <label class="f">Dauer in Minuten<input id="m_dur" inputmode="numeric" value="30"></label>
    <label class="f">Intensität: <b id="m_rl">5 von 10, moderat</b><input id="m_rpe" data-in="rpe" type="range" min="1" max="10" value="5"></label>
    <label class="f">Datum<input id="m_date" type="date" max="${todayISO()}" value="${s.date||todayISO()}"></label>
    <label class="f">Notiz<textarea id="m_notes"></textarea></label>
    <p class="sub">Ab 20 Minuten zählt die Einheit für dein Wochenziel.</p><button class="btn primary block" data-act="savemanual">Speichern</button>`);
  else if(s.t==='pick'){const tg=s.target,pl=tg&&tg.p?S.plans.find(p=>p.id===tg.p):null;
    h=sh(s.multi&&tg&&tg.p?'Tag '+(tg.d+1)+': Übungen wählen':'Übung wählen',`<button class="btn block" data-act="newexfrom">+ Eigene Übung erstellen</button><input id="q" data-in="q" type="search" placeholder="Suchen" value="${esc(UI.q)}" aria-label="Übung suchen">${muChips()}<div id="pklist" data-mode="pick">${exListHtml('pick')}</div>${s.multi?`<div class="pkbar"><button class="btn primary block" data-act="pickdone">${pkLabel()}</button></div>`:''}`)}
  else if(s.t==='newex')h=sh('Eigene Übung',`<label class="f">Name<input id="n_name" placeholder="z. B. Hammer-Strength Rudern"></label>
    <label class="f">Hauptmuskel<select id="n_m">${opts(MUSCLES.map(m=>[m,m]),'Rücken')}</select></label>
    <label class="f">Equipment<select id="n_eq">${opts(EQUIP.map(m=>[m,m]),'Maschine')}</select></label>
    <label class="f">Beschreibung<textarea id="n_d" placeholder="Einstellungen, Technik, Hinweise"></textarea></label>
    <button class="btn primary block" data-act="savenew">Speichern</button>`);
  else if(s.t==='exinfo'){const x=exById(s.id),b=bestE1(s.id),ls=lastSets(s.id);
    h=sh(x.name,`<div class="row wrap"><span class="tag acc">${esc(x.m)}</span>${x.m2.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}<span class="tag">${esc(x.eq)}</span></div>
    ${x.img?`<div class="card">${figSvg(x.img)}</div>`:''}
    ${x.d?`<p>${esc(x.d)}</p>`:''}
    ${x.h?`<div class="card stack"><p class="lbl">Richtige Ausführung</p><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${x.h.split('|').map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`:''}
    ${x.e?`<div class="card stack" style="border-color:var(--alt)"><p class="lbl" style="color:var(--alt)">Typische Fehler und Verletzungsgefahr</p><ul style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">${x.e.split('|').map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}
    ${!x.d&&!x.h?'<p class="sub">Keine Beschreibung hinterlegt.</p>':''}
    ${b||ls.length?`<div class="card"><p class="lbl">Dein Stand</p><p>${b?'<b class="num" style="font-size:22px">'+fmt(b)+' kg</b> geschätztes 1RM':''}${ls.length?'<br><span class="sub">Zuletzt: '+ls.map(q=>setTxt(s.id,q)).join(', ')+'</span>':''}</p></div><button class="btn block" data-act="gotoprog" data-id="${x.id}">Verlauf ansehen</button>`:''}
    <p class="sub">Die Hinweise ersetzen keine Anleitung durch Trainer oder Physio. Bei Schmerz die Übung abbrechen.</p>
    ${x.custom?`<button class="btn danger block" data-act="delex" data-id="${x.id}">Übung löschen</button>`:''}`)}
  else if(s.t==='hist'){const w=S.workouts.find(w=>w.id===s.id);if(!w){UI.sheet=null;return renderSheet()}
    h=sh(w.name,`<p class="sub">${dfmt(w.date,{weekday:'long',day:'numeric',month:'long'})} · ${w.dur} Min</p>
    ${w.type==='gym'?w.entries.map(e=>`<div><b>${esc(exById(e.exId).name)}</b>${(w.prs||[]).includes(e.exId)?' <span class="tag acc">Rekord</span>':''}<br><span class="sub">${e.sets.map(q=>(q.t==='w'?'W ':'')+setTxt(e.exId,q)).join(' · ')}</span>${e.notes?`<br><span class="sub">„${esc(e.notes)}“</span>`:''}</div>`).join(''):`<p>Intensität ${w.rpe} von 10</p>`}
    ${w.notes?`<div class="card"><p class="sub">${esc(w.notes)}</p></div>`:''}
    <button class="btn danger block" data-act="delw" data-id="${w.id}">${UI.cf==='w'+w.id?'Wirklich löschen?':'Eintrag löschen'}</button>`)}
  else if(s.t==='sum'){const w=S.workouts.find(w=>w.id===s.id);if(!w){UI.sheet=null;return renderSheet()}
    h=sh('Geschafft',`<div class="card stack"><div class="row" style="gap:20px"><div><p class="lbl">Volumen</p><span class="num" style="font-size:30px">${fmt(w.vol/1000,2)} t</span></div><div><p class="lbl">Dauer</p><span class="num" style="font-size:30px">${w.dur}′</span></div><div><p class="lbl">Sätze</p><span class="num" style="font-size:30px">${w.sets}</span></div></div></div>
    ${(w.prs||[]).length?`<div class="note"><b>Neue Bestmarken:</b> ${w.prs.map(id=>esc(exById(id).name)).join(', ')}</div>`:''}
    ${s.nb&&s.nb.length?`<div class="note rest"><b>Neues Abzeichen:</b> ${s.nb.map(id=>esc(BADGES.find(b=>b.id===id).n)).join(', ')}</div>`:''}
    <button class="btn primary block" data-act="close">Fertig</button>`)}
  else if(s.t==='course'){
    h=sh('Kurs hinzufügen',`<label class="f">Kurs<select id="c_pre" data-in="cpre">${opts(Object.entries(COURSES).map(([k,v])=>[k,k==='eigen'?'Eigener Kurs …':v[0]]),'shine')}</select></label>

    <p class="sub">Bei Kniebeschwerden: Rad mit hohem Sattel und mäßigem Widerstand ist meist verträglicher als Laufen oder Treppen. Lass dich bei Unsicherheit von Physio oder Ärztin beraten.</p>
    <button class="btn primary block" data-act="spstart">Start</button>`);
    else if(SP.fin)h=sh('Sprints geschafft',`<div class="card"><p class="num" style="font-size:30px">${SP.n} × ${SP.s} s</p><p class="sub">Danach locker auslaufen. Speichern zählt 10 Minuten Ein- und Auslaufen mit.</p></div><button class="btn primary block" data-act="spsave">Speichern</button><button class="btn block" data-act="close">Verwerfen</button>`);
    else h=sh('Sprint-Intervalle',`<div class="card stack" style="text-align:center"><p class="lbl" id="spr"></p><h1 id="spl" style="font-size:48px"></h1><div class="num" id="spt" style="font-size:96px;line-height:1"></div></div><button class="btn block" data-act="spnext">Phase überspringen</button><button class="btn danger block" data-act="close">Abbrechen</button>`)}
  else if(s.t==='settings'){const c=S.settings;
    h=sh('Einstellungen',`<label class="f">Wochenziel (Trainings)<select data-in="cfg" data-k="weekGoal">${opts([1,2,3,4,5,6,7].map(n=>[n,n+'× pro Woche']),c.weekGoal)}</select></label>
    <label class="f">Deine Motivation (Text auf „Heute“, leer lassen für wechselnde Sprüche)<textarea data-in="cfg" data-k="motto" rows="2" placeholder="z. B. Ich bin stark und ich bleibe dran">${esc(c.motto)}</textarea></label>
    <div><p class="sub" style="margin-bottom:6px">Geplante Trainingstage</p><div class="chips">${DAYS.map((d,i)=>`<button class="chip ${c.trainDays.includes(i)?'on':''}" data-act="tday" data-i="${i}">${d}</button>`).join('')}</div></div>
    <label class="f">Erinnerung ab<input type="time" data-in="cfg" data-k="remindTime" value="${esc(c.remindTime)}"></label>
    <button class="btn block" data-act="notif">${c.notif?'Benachrichtigungen sind an':'Benachrichtigungen erlauben'}</button>
    <p class="sub">Erinnerungen erscheinen zuerst in der App und nur, wenn sie nützen: nicht nach einem Training, nicht nach drei Krafttagen in Folge. Systemmeldungen im Hintergrund braucht später eine native App.</p>
    <label class="f">Knie<select data-in="cfg" data-k="kneeb">${opts([[1,'Patellarsehne schonen'],[0,'Keine Rücksicht']],c.knee?1:0)}</select></label>
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <p class="lbl">Backup</p><p class="sub">Deine Daten liegen nur in diesem Browser. Kopiere das Backup und speichere es z. B. in Notizen.</p>
    <button class="btn block" data-act="export">Backup kopieren</button>
    <textarea id="imp" placeholder="Backup hier einfügen"></textarea><button class="btn block" data-act="import">Backup einspielen</button>
    <button class="btn danger block" data-act="reset">${UI.cf==='reset'?'Wirklich alles löschen?':'Alle Daten löschen'}</button>`)}
  el.innerHTML=h;
}

function pkLabel(){const sl=UI.sheet,n=sl.sel.length,tg=sl.target,p=tg&&tg.p?S.plans.find(p=>p.id===tg.p):null;
  if(sl.chain&&p&&tg.d+1<p.days.length)return 'Weiter zu Tag '+(tg.d+2)+' ('+n+' gewählt)';
  return 'Hinzufügen ('+n+')'}
/* ===== Rendern ===== */
function render(){
  const y=window.scrollY;
  $('#view').innerHTML={home:viewHome,train:viewTrain,plans:viewPlans,ex:viewEx,prog:viewProg}[UI.tab]();
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  renderSheet();tick(true);window.scrollTo(0,y);
}
function sprintUi(){const p=SP.phases[SP.idx];const l=$('#spl'),tt=$('#spt'),r=$('#spr');if(!l)return;const left=Math.max(0,Math.ceil((SP.end-Date.now())/1000));l.textContent=p.l;l.style.color=p.l==='Sprint'?'var(--alt)':'var(--ink)';tt.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');r.textContent=p.i?('Sprint '+p.i+' von '+SP.n):(p.l==='Pause'?'Nächster Sprint '+(p.nx)+' von '+SP.n:'Bereit machen')}
function sprintTick(){
  if(!SP||SP.fin)return;
  if(Date.now()>=SP.end){beep();SP.idx++;if(SP.idx>=SP.phases.length){SP.fin=true;renderSheet();return}SP.end=Date.now()+SP.phases[SP.idx].sec*1000}
  sprintUi();
}
function prime(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function startRest(sec){prime();UI.rest={end:Date.now()+sec*1000,total:sec,fired:false};tick(true)}
function tick(force){
  const t=$('#timer');
  if(S.active){const el=$('#elapsed');if(el)el.textContent=Math.floor((Date.now()-S.active.start)/60000)+' Min · '+S.active.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)+' Sätze'}
  sprintTick();
  const r=UI.rest;if(!r){t.hidden=true;return}
  const left=Math.ceil((r.end-Date.now())/1000);
  if(left<=0){
    if(!r.fired){r.fired=true;beep();t.className='done';t.hidden=false;t.innerHTML='<span class="t">Los!</span><span style="flex:1">Pause vorbei</span><button data-act="restskip">OK</button>';r.hide=Date.now()+8000;return}
    if(Date.now()>r.hide){UI.rest=null;t.hidden=true}return;
  }
  const txt=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  if(force||t.dataset.k!=='run'||t.hidden){t.className='';t.hidden=false;t.dataset.k='run';t.innerHTML=`<span class="t">${txt}</span><span style="flex:1">Pause</span><button data-act="restadd" data-d="-15">−15</button><button data-act="restadd" data-d="15">+15</button><button data-act="restskip">Skip</button>`}
  else t.querySelector('.t').textContent=txt;
  if(t.className==='done'){t.className='';t.dataset.k=''}
}

/* ===== Aktionen ===== */
const A={
  sheet(t,d){UI.sheet={t:d.t,target:d.target||null};if(d.t==='pick'){UI.q='';UI.mus=[]}render()},

    UI.sheet=null;save();render();toast('Kurs hinzugefügt')},
  coursehit(t,d){const c=S.courses.find(c=>c.id===d.id);if(!c)return;const ds=courseDate(c),i=S.workouts.findIndex(w=>w.courseId===c.id&&w.date===ds);
    if(i>=0){S.workouts.splice(i,1)}
    else{if(ds>todayISO()){toast('Der Kurs liegt noch in der Zukunft');return}
      S.workouts.push({id:uid(),type:'manual',sport:c.name,name:c.name,date:ds,ts:ds===todayISO()?Date.now():parse(ds).getTime()+12*36e5,dur:c.dur,rpe:c.rpe,notes:'Kurs',entries:[],prs:[],vol:0,sets:0,xp:20,courseId:c.id})}
    save();render()},
  coursedel(t,d){if(UI.cf!=='c'+d.id){UI.cf='c'+d.id;render();setTimeout(()=>{if(UI.cf==='c'+d.id){UI.cf=null;render()}},4000);return}S.courses=S.courses.filter(c=>c.id!==d.id);UI.cf=null;save();render()},
  gmode(t,d){UI.sheet={t:'gen',mode:d.m,mus:(UI.sheet&&UI.sheet.mus)||[]};renderSheet()},
  gmu(t,d){const s=UI.sheet;if($('#g_name'))s.name=$('#g_name').value;if($('#g_days'))s.days=+$('#g_days').value;s.mus=s.mus||[];const i=s.mus.indexOf(d.m);if(i>=0)s.mus.splice(i,1);else s.mus.push(d.m);renderSheet()},
  backfill(t,d){UI.sheet={t:'manual',title:'Training nachtragen',date:d.date||'',back:true};render()},
  pmv(t,d){const a=S.plans.find(p=>p.id===d.p).days[+d.d].ex,i=+d.k,j=i+ +d.m;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()},
  newexfrom(){UI.sheet={t:'newex',back:UI.sheet};renderSheet()},
  close(){SP=null;UI.sheet=null;UI.cf=null;render()},
  startempty(){startWorkout('Training',[])},
  startplan(t,d){const p=S.plans.find(p=>p.id===d.p);if(!p)return;if(S.active){toast('Es läuft bereits ein Training');UI.tab='train';render();return}const day=p.days[+d.d];
    if(day.kind==='sprint'){SP=null;UI.sheet={t:'sprint',sp:day.sp,p:p.id,d:+d.d};render();return}
    if(day.kind==='locker'){UI.sheet={t:'manual',sport:'Mobility',p:p.id,d:+d.d};render();return}
    startWorkout(day.name,day.ex,p.id,+d.d)},
  done(t,d){const e=S.active.entries[+d.i],s=e.sets[+d.j];s.done=!s.done;
    if(s.done){if(s.r===''&&e.target)s.r=String(e.target).split('-')[0];if(!e.link&&s.t!=='w')startRest(S.settings.rest)}
    save();render()},
  stype(t,d){const s=S.active.entries[+d.i].sets[+d.j];s.t=s.t==='n'?'w':s.t==='w'?'d':'n';save();render()},
  addset(t,d){const e=S.active.entries[+d.i],l=e.sets[e.sets.length-1];e.sets.push({w:l?l.w:'',r:l?l.r:'',done:false,t:'n'});save();render()},
  delset(t,d){const e=S.active.entries[+d.i];if(e.sets.length>1)e.sets.pop();save();render()},
  note(t,d){UI.noteOpen[d.i]=!UI.noteOpen[d.i];render()},
  link(t,d){const e=S.active.entries[+d.i];e.link=!e.link;save();render()},
  mv(t,d){const a=S.active.entries,i=+d.i,j=i+ +d.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()},
  rmex(t,d){S.active.entries.splice(+d.i,1);save();render()},
  exinfo(t,d){UI.sheet={t:'exinfo',id:d.id};render()},
  pickex(t,d){const sl=UI.sheet,tg=sl.target;
    if(sl.multi){const i=sl.sel.indexOf(d.id);if(i>=0)sl.sel.splice(i,1);else sl.sel.push(d.id);$('#pklist').innerHTML=exListHtml('pick');const b=document.querySelector('[data-act=pickdone]');if(b)b.textContent=pkLabel();return}
    if(tg==='workout'&&S.active)S.active.entries.push(mkEntry(d.id,3,''));
    UI.sheet=null;save();render();toast('Übung hinzugefügt')},
  pickdone(){const sl=UI.sheet,tg=sl.target,p=S.plans.find(p=>p.id===tg.p);if(!p){UI.sheet=null;render();return}
    sl.sel.forEach(id=>p.days[tg.d].ex.push({id,sets:3,reps:tm(id)?'40':'8-12',w:''}));save();
    if(sl.chain&&tg.d+1<p.days.length){UI.sheet={t:'pick',target:{p:tg.p,d:tg.d+1},multi:true,sel:[],chain:true};UI.q='';render();toast('Tag '+(tg.d+1)+' gespeichert')}
    else{UI.sheet=null;render();toast('Gespeichert')}},
  finish(){const a=S.active;if(!a.entries.some(e=>e.sets.some(s=>s.done))){toast('Hake mindestens einen Satz ab');return}
    const before=earned(),w=finalize(a,Date.now());S.active=null;UI.rest=null;save();UI.sheet={t:'sum',id:w.id,nb:earned().filter(x=>!before.includes(x))};try{wl&&wl.release()}catch(e){}render();if(w.planId&&w.dayIdx!=null)afterPlanWorkout(w.planId,w.dayIdx)},

  restadd(t,d){if(UI.rest){UI.rest.end+=+d.d*1000;UI.rest.fired=false;tick(true)}},
  restskip(){UI.rest=null;tick(true)},
  spstart(){prime();const n=Math.max(1,num($('#sp_n').value)|0),sd=Math.max(5,num($('#sp_s').value)|0),r=Math.max(10,num($('#sp_r').value)|0);const ph=[{l:'Gleich geht\'s los',sec:10,i:0,nx:1}];
    for(let i=1;i<=n;i++){ph.push({l:'Sprint',sec:sd,i});if(i<n)ph.push({l:'Pause',sec:r,i:0,nx:i+1})}
    SP={phases:ph,idx:0,end:Date.now()+10000,t0:Date.now(),n,s:sd,r,sport:$('#sp_sport').value,p:UI.sheet.p,d:UI.sheet.d,fin:false};renderSheet();sprintUi()},
  spnext(){if(SP&&!SP.fin)SP.end=Date.now()},
  spsave(){const dur=Math.max(1,Math.round((Date.now()-SP.t0)/60000))+10;
    S.workouts.push({id:uid(),type:'manual',sport:SP.sport,name:'Sprint-Intervalle',date:todayISO(),ts:Date.now(),dur,rpe:9,notes:SP.n+' × '+SP.s+' s, Pause '+Math.round(SP.r/60*10)/10+' Min',entries:[],prs:[],vol:0,sets:0,xp:20+Math.round(Math.min(dur,60)/3),planId:SP.p||null,dayIdx:SP.d==null?null:SP.d});
    const pp=SP.p,pd=SP.d;SP=null;UI.sheet=null;save();render();toast('Sprint-Einheit gespeichert');if(pp&&pd!=null)afterPlanWorkout(pp,pd)},
  hist(t,d){UI.sheet={t:'hist',id:d.id};render()},
  delw(t,d){if(UI.cf!=='w'+d.id){UI.cf='w'+d.id;renderSheet();return}S.workouts=S.workouts.filter(w=>w.id!==d.id);UI.cf=null;UI.sheet=null;save();render()},
  dogen(){
    const fk=UI.sheet.mode==='man'?'':$('#g_focus').value;
    if(UI.sheet.mode==='man'){
      const n=+$('#g_days').value,p={id:uid(),name:$('#g_name').value.trim()||'Mein Plan',goal:'manual',level:'mid',manual:true,knee:S.settings.knee,days:Array.from({length:n},(_,i)=>({name:'Tag '+(i+1),kind:'kraft',ex:[]}))};
      S.plans.push(p);S.activePlan=p.id;UI.tab='plans';UI.q='';UI.mus=(UI.sheet.mus||[]).slice();

    S.plans.push(p);S.activePlan=p.id;UI.sheet=null;UI.tab='plans';save();render()},

  delplan(t,d){if(UI.cf!=='plan'+d.p){UI.cf='plan'+d.p;render();return}S.plans=S.plans.filter(p=>p.id!==d.p);if(S.activePlan===d.p)S.activePlan=S.plans[0]?S.plans[0].id:null;UI.cf=null;save();render()},
  pdel(t,d){S.plans.find(p=>p.id===d.p).days[+d.d].ex.splice(+d.k,1);save();render()},
  padd(t,d){UI.q='';UI.mus=[];UI.sheet={t:'pick',target:{p:d.p,d:d.d}};render()},

document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset.in;if(!k)return;
  if(k==='set'){S.active.entries[+t.dataset.i].sets[+t.dataset.j][t.dataset.f]=t.value;save()}
  else if(k==='exnote'){S.active.entries[+t.dataset.i].notes=t.value;save()}
  else if(k==='aname'){S.active.name=t.value;save()}
  else if(k==='anotes'){S.active.notes=t.value;save()}
  else if(k==='q'){UI.q=t.value;const l=$('#exlist')||$('#pklist');if(l)l.innerHTML=exListHtml(l.dataset.mode)}
  else if(k==='cpre'){const v=COURSES[t.value];$('#c_cw').hidden=t.value!=='eigen';$('#c_dur').value=v[1];$('#c_rpe').value=v[2];$('#c_rl').textContent=v[2]+' von 10, '+(v[2]<=3?'leicht':v[2]<=6?'moderat':v[2]<=8?'hart':'maximal')}
  else if(k==='rpe'){const v=+t.value;$('#'+(t.dataset.l||'m_rl')).textContent=v+' von 10, '+(v<=3?'leicht':v<=6?'moderat':v<=8?'hart':'maximal')}
  else if(k==='pex'){const p=S.plans.find(p=>p.id===t.dataset.p);if(p){const x=p.days[+t.dataset.d].ex[+t.dataset.x];if(x){if(t.dataset.f==='sets')x.sets=Math.max(1,parseInt(t.value)||1);else if(t.dataset.f==='w')x.w=t.value;else x.reps=t.value;save()}}}
  else if(k==='dayname'){const p=S.plans.find(p=>p.id===t.dataset.p);if(p){p.days[+t.dataset.d].name=t.value;save()}}
  else if(k==='progex'){UI.progEx=t.value;render()}
  else if(k==='cfg'){const key=t.dataset.k;if(key==='kneeb')S.settings.knee=t.value==='1';else S.settings[key]=['weekGoal','rest'].includes(key)?+t.value:t.value;save()}
});
